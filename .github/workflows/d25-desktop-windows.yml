name: D25 Desktop Windows installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'assets/d25-desktop-icon.svg'
      - 'apps/web/**'
      - 'functions/**'
      - 'cloudflare/**'
      - 'vercel.json'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/d25-desktop-windows.yml'
      - 'scripts/d25_store_preflight.mjs'
      - 'scripts/build-store-msix.ps1'
      - 'scripts/check-d25-release-config.mjs'
      - 'docs/D25_STORE_RELEASE_GATES.md'
      - 'scripts/verify-commercial-bundle.mjs'
      - 'scripts/build-private-engine.mjs'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    # This is a PUBLIC Firebase Web API key, NOT a service account or
    # Razorpay secret. The browser-based Windows app necessarily ships it.
    # Configure Settings > Secrets and variables > Actions > Variables:
    # D25_FIREBASE_WEB_API_KEY = the project's actual Firebase Web API key.
    env:
      VITE_D25_FIREBASE_API_KEY: ${{ vars.D25_FIREBASE_WEB_API_KEY }}
      # Can later point at a separately deployed LIVE Worker only after acceptance.
      VITE_D25_API_BASE: ${{ vars.D25_LICENSE_API_URL || 'https://d25-license.mahquantum.workers.dev/v1' }}
      # Google Desktop OAuth client ID is PUBLIC; do not use the Firebase Web client ID.
      VITE_D25_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.D25_GOOGLE_DESKTOP_CLIENT_ID }}
      # Installed-app OAuth client secrets cannot be kept private; optional.
      VITE_D25_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.D25_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install web dependencies without changing lockfile
        run: npm ci
      - name: Run quantum engine tests
        run: npm test
      - name: Verify Cloudflare D1 / Razorpay TEST licensing code
        run: |
          node --check cloudflare/src/worker.mjs
          node --check cloudflare/src/auth.mjs
          node --check cloudflare/src/razorpay.mjs
          node --experimental-sqlite --test cloudflare/test/*.test.mjs
      - name: Confirm desktop native Google OAuth and payment-link helpers are present
        run: |
          node --check cloudflare/src/worker.mjs
          node --check cloudflare/src/razorpay.mjs
      - name: Create D25 Windows icons
        run: npm run desktop:icons
      - name: Rust native shell checks (no local license gate)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Validate Firebase and Cloudflare public desktop configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_D25_FIREBASE_API_KEY)) {
            Write-Host "::warning::D25_FIREBASE_WEB_API_KEY repository variable is missing. The resulting installer displays a setup blocker and is NOT usable for sign-in."
            "D25 desktop: NOT CONFIGURED - development placeholder only" >> $env:GITHUB_STEP_SUMMARY
            node scripts/check-d25-release-config.mjs
            if ($LASTEXITCODE -eq 0) { throw "Unconfigured app unexpectedly passed release preflight." }
            $global:LASTEXITCODE = 0
          } else {
            node scripts/check-d25-release-config.mjs
            if ($LASTEXITCODE -ne 0) { throw "Invalid Firebase / Cloudflare desktop configuration." }
            "D25 desktop: PUBLIC Firebase and Cloudflare endpoints configured; subscription acceptance still required" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Build Windows EXE and MSI installers
        run: npm run desktop:build
      - name: Audit desktop bundle and record Microsoft Store release blockers
        run: node scripts/d25_store_preflight.mjs
      - name: Check MSIX packaging with a development-only identity (NOT FOR PUBLICATION)
        shell: pwsh
        run: |
          ./scripts/build-store-msix.ps1 -IdentityName "MAHQuantum.D25.DevValidation" -Publisher "CN=D25 Development Identity" -Version "1.0.0.0" -OutputPath "artifacts/store/D25-DEV-UNSIGNED.msix"
      - name: Upload Store readiness report (does not certify the app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D25-Store-Readiness-NO-GO-Report
          path: artifacts/d25-store-preflight.json
          if-no-files-found: warn
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D25-INTERNAL-ONLY-Development-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
