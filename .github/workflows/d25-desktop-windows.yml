name: D25 Desktop Windows installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'assets/d25-desktop-icon.svg'
      - 'apps/web/**'
      - 'functions/**'
      - 'vercel.json'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/d25-desktop-windows.yml'
      - 'scripts/d25_store_preflight.mjs'
      - 'scripts/build-store-msix.ps1'
      - 'docs/D25_STORE_RELEASE_GATES.md'
      - 'scripts/verify-commercial-bundle.mjs'
      - 'scripts/build-private-engine.mjs'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install web dependencies without changing lockfile
        run: npm ci
      - name: Run quantum engine tests
        run: npm test
      - name: Check Firebase recurring billing backend and policies
        run: |
          node --check functions/index.js
          node --test functions/test/*.test.cjs
      - name: Resolve and audit Firebase Cloud Functions production dependencies
        run: |
          npm install --prefix functions --ignore-scripts --no-fund
          npm audit --prefix functions --omit=dev --audit-level=high
          node -e "require('./functions/index.js')"
      - name: Build and test private service quantum engine (not distributed)
        run: |
          npm run build:private-engine
          node --test functions/test/compute-policy.test.cjs functions/test/compute-engine.test.cjs
      - name: Create D25 Windows icons
        run: npm run desktop:icons
      - name: Rust native shell checks (no local license gate)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows EXE and MSI installers
        run: npm run desktop:build
      - name: Audit desktop bundle and record Microsoft Store release blockers
        run: node scripts/d25_store_preflight.mjs
      - name: Check MSIX packaging with a development-only identity (NOT FOR PUBLICATION)
        shell: pwsh
        run: |
          ./scripts/build-store-msix.ps1 -IdentityName "MAHQuantum.D25.DevValidation" -Publisher "CN=D25 Development Identity" -Version "1.0.0.0" -OutputPath "artifacts/store/D25-DEV-UNSIGNED.msix"
      - name: Upload Store readiness report (does not certify the app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D25-Store-Readiness-NO-GO-Report
          path: artifacts/d25-store-preflight.json
          if-no-files-found: warn
      - name: Upload Windows installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D25-Quantum-Workspace-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
