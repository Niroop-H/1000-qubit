[package]
name = "d25-quantum-workspace"
version = "1.0.0"
description = "D25 Quantum Workspace by Devashri S Industries, a division of MAH Quantum"
authors = ["Devashri S Industries (MAH Quantum)"]
edition = "2021"
publish = false

[lib]
name = "d25_quantum_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop Google OAuth: system browser + loopback redirect + PKCE.
# A native/Desktop OAuth client ID is public application configuration.
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webbrowser = { version = "1", features = ["hardened"] }
